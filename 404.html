<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  quotes = [
    ['If I have seen further it is by standing on the shoulders of giants.', 'ISAAC NEWTON'],
    ['Nothing in life is to be feared, it is only to be understood.', 'MARIE CURIE'],
    ['The important thing is not to stop questioning.', 'ALBERT EINSTEIN'],
    ['Somewhere, something incredible is waiting to be known.', 'CARL SAGAN'],
    ['The first principle is that you must not fool yourself, and you are the easiest person to fool.', 'RICHARD FEYNMAN'],
    ['In the fields of observation chance favours only the prepared mind.', 'LOUIS PASTEUR'],
    ['We can only see a short distance ahead, but we can see plenty there that needs to be done.', 'ALAN TURING'],
    ['An expert is a person who has made all the mistakes that can be made in a very narrow field.', 'NIELS BOHR'],
    ['Research is what I am doing when I do not know what I am doing.', 'WERNHER VON BRAUN'],
    ['Not only is the universe stranger than we think, it is stranger than we can think.', 'WERNER HEISENBERG'],
    ['Equipped with his five senses, man explores the universe around him and calls the adventure Science.', 'EDWIN HUBBLE'],
    ['I seem to have been only like a boy playing on the seashore, whilst the great ocean of truth lay all undiscovered before me.', 'ISAAC NEWTON']
  ];
  state = { i: -1 };
  componentDidMount() { this.setState({ i: Math.floor(Math.random() * this.quotes.length) }); }
  sealRef = el => {
    if (!el || el.__ran) return; el.__ran = true;
    el.animate([{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
  };
  quoteRef = el => {
    if (!el || el.__ran) return; el.__ran = true;
    el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: 360, easing: 'ease-out', fill: 'both' });
  };
  renderVals() {
    const q = this.state.i < 0 ? ['', ''] : this.quotes[this.state.i];
    return { quoteText: q[0], quoteAuthor: q[1], sealRef: this.sealRef, quoteRef: this.quoteRef };
  }
}
</script>
